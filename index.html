<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>לוח שבת - קהילת אורות ישראל</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Frank+Ruhl+Libre:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root { 
            --primary: #1a3b80; 
            --text: #333;
            --bg-web: #f0f2f5;
            --card-shadow: 0 4px 12px rgba(0,0,0,0.08);
        }

        body { 
            font-family: 'Rubik', sans-serif; 
            margin: 0; padding: 0; 
            background-color: var(--bg-web);
            color: var(--text);
            line-height: 1.6;
        }

        .web-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            padding-bottom: 100px;
        }

        /* --- HEADER --- */
        .header-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: var(--card-shadow);
            margin-bottom: 20px;
            text-align: center;
            border-top: 5px solid var(--primary);
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .bsd { font-size: 14px; color: #888; }
        .logo-img { height: 60px; object-fit: contain; }

        .main-title {
            color: var(--primary);
            font-size: 1.8rem;
            font-weight: 700;
            margin: 0;
        }
        .sub-title {
            color: #666;
            font-weight: 500;
            margin-top: 5px;
            font-size: 1.1rem;
        }

        /* --- GRID LAYOUT (Responsive) --- */
        .top-section-grid {
            display: flex;
            gap: 20px;
            margin: 30px 0;
            flex-direction: column; /* Mobile Default: Column */
        }

        /* Mobile Order: Times First (1), Image Last (2) */
        .times-column {
            order: 1; 
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: var(--card-shadow);
        }

        .image-column {
            order: 2; /* Forces Image to bottom on Mobile */
        }

        /* On Desktop/Tablet: Side by Side */
        @media (min-width: 768px) {
            .top-section-grid {
                flex-direction: row;
                align-items: flex-start;
            }
            .times-column { flex: 1; order: 1; }
            .image-column { flex: 1; order: 2; }
        }

        .shul-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
        }

        /* --- TIME ROWS --- */
        .time-row {
            display: flex;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
            gap: 15px;
        }
        .time-row:last-child { border-bottom: none; }
        
        /* Web View: Time Left, Desc Right (Standard List) */
        .time { 
            font-weight: 700; 
            font-size: 1.2rem; 
            color: var(--primary);
            background: #eef4ff;
            padding: 2px 10px;
            border-radius: 8px;
            min-width: 60px;
            text-align: center;
        }
        .desc { font-weight: 500; color: #444; flex: 1; }

        .section-header {
            color: var(--primary);
            font-weight: 700;
            font-size: 1rem;
            margin: 20px 0 10px 0;
            text-decoration: underline;
        }

        /* Shabbat Day Card */
        .shabbat-day-card {
            background: white;
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            padding: 25px;
            margin-top: 20px;
        }

        .note-text {
            background: #fff8e1;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 0.95rem;
            color: #795548;
            text-align: center;
            border-right: 4px solid #ffc107;
        }

        /* Dvar Torah */
        .dvar-torah-container { margin-top: 20px; }
        .dt-btn {
            width: 100%; background: white; border: 2px solid var(--primary);
            color: var(--primary); padding: 15px; border-radius: 12px;
            font-size: 1rem; font-weight: bold; cursor: pointer;
            display: flex; justify-content: space-between; align-items: center;
        }
        .dt-content {
            background: white; margin-top: 10px; padding: 20px;
            border-radius: 12px; box-shadow: var(--card-shadow); display: none;
        }

        /* Floating Print Button */
        .floating-print {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: #333; color: white; padding: 12px 30px;
            border-radius: 30px; font-weight: bold; box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            border: none; cursor: pointer; z-index: 100;
        }

        .loader { border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 50px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .hidden { display: none; }

        /* ==========================================================================
           🖨️ PRINT STYLES (PDF Replica)
           ========================================================================== */
        @media print {
            @page { size: A4 portrait; margin: 1cm; }
            
            body { 
                background: white; 
                color: black;
                font-family: 'Rubik', sans-serif;
                -webkit-print-color-adjust: exact;
            }

            .web-container { max-width: 100%; margin: 0; padding: 0; box-shadow: none; }
            .floating-print, .loader, .dvar-torah-container { display: none !important; }

            /* Header */
            .header-card { box-shadow: none; border: none; padding: 0; margin-bottom: 20px; text-align: center; }
            .header-row { margin-bottom: 0; }
            .logo-img { height: 80px; }
            .main-title { font-size: 28px; margin-top: 10px; color: #1a3b80 !important; }
            .sub-title { font-size: 18px; margin-bottom: 40px; color: black; }

            /* Grid: Text Right, Image Left */
            .top-section-grid {
                display: grid;
                grid-template-columns: 1fr 35%; /* Text gets more space, Image gets 35% */
                gap: 40px;
                margin: 30px 0;
            }

            .times-column {
                order: 1; /* Text on Right */
                background: none; padding: 0; box-shadow: none; border-radius: 0;
            }

            .image-column {
                order: 2; /* Image on Left */
            }

            .shul-image {
                height: 200px; width: 100%; border: 1px solid #ccc; box-shadow: none; border-radius: 4px;
            }

            /* Time Rows in Print: [Time] [Text] */
            .time-row {
                border-bottom: none;
                padding: 4px 0;
                justify-content: flex-start; /* Align Right */
            }
            
            /* Clean Text Styling */
            .time { 
                background: none; color: black !important; font-size: 18px; padding: 0;
                min-width: 60px; text-align: right; margin-left: 15px;
            }
            .desc { font-size: 18px; font-weight: normal; color: black; }
            
            .section-header {
                color: #1a3b80 !important; font-size: 18px; 
                margin-top: 30px; margin-bottom: 10px; text-align: right;
                text-decoration: none; font-weight: bold;
            }

            /* Shabbat Day Section */
            .shabbat-day-card {
                background: none; box-shadow: none; padding: 0; margin-top: 40px; text-align: center;
            }
            
            .center-row {
                display: flex; justify-content: center; gap: 15px; margin-bottom: 5px;
            }
            
            /* Note Text Clean */
            .note-text {
                background: none; border: none; padding: 0; margin-top: 10px; 
                color: black; text-align: center; font-style: italic;
            }

            .footer-shabbat {
                text-align: center; font-size: 28px; font-weight: 700; margin-top: 60px;
            }
        }
    </style>
</head>
<body>

<!-- Main Container -->
<div class="web-container">
    <div id="loader" class="loader"></div>

    <div id="content" class="hidden">
        
        <!-- Header -->
        <div class="header-card">
            <div class="header-row">
                <div class="bsd">בס"ד</div>
                <div class="logo-area">
                    <img src="logo.jpg" alt="Logo" class="logo-img" onerror="this.style.display='none'">
                </div>
            </div>
            <div class="main-title" id="parsha-name">שבת קודש...</div>
            <div class="sub-title" id="mevarchim-text"></div>
        </div>

        <!-- TOP SECTION: Grid -->
        <div class="top-section-grid">
            
            <!-- Times Column -->
            <div class="times-column">
                <div class="time-row">
                    <span class="time" id="candle-lighting">--:--</span>
                    <span class="desc">הדלקת נרות שבת</span>
                </div>
                <div class="time-row">
                    <span class="time" id="havdalah">--:--</span>
                    <span class="desc">צאת השבת</span>
                </div>

                <div class="section-header">ערב שבת</div>
                <div class="time-row">
                    <span class="time" id="mincha-erev">--:--</span>
                    <span class="desc">מנחה, קבלת שבת וערבית</span>
                </div>
            </div>

            <!-- Image Column -->
            <div class="image-column">
                <img src="kotel.jpg" alt="Shul Image" class="shul-image" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/thumb/d/d4/Jerusalem_Symbol.svg/600px-Jerusalem_Symbol.svg.png'">
            </div>
        </div>

        <!-- SHABBAT DAY -->
        <div class="shabbat-day-card">
            <div class="section-header" style="text-align:center; margin-bottom:20px;">שבת קודש</div>
            
            <div class="center-row">
                <span class="time">7:45</span>
                <span class="desc" style="flex:none;">שחרית ומוסף</span>
            </div>
            
            <div class="center-row">
                <span class="time">9:15</span>
                <span class="desc" style="flex:none;">תפילת ילדים</span>
            </div>

            <div class="note-text">
                שיעור מאת הרב נתנאל בהלכות שבת לאחר התפילה
            </div>
            
            <br>

            <!-- Removed "Afternoon" Title as requested, just spacing -->
            
            <div class="center-row">
                <span class="time">15:00</span>
                <span class="desc" style="flex:none;">לימוד בספר "אורות"</span>
            </div>
            
            <div class="center-row">
                <span class="time">15:45</span>
                <span class="desc" style="flex:none;">מנחה של שבת</span>
            </div>

            <div class="center-row">
                <span class="time" id="arvit-motzash">--:--</span>
                <span class="desc" style="flex:none;">ערבית של מוצאי שבת</span>
            </div>
        </div>
        
        <div class="footer-shabbat" style="text-align:center; margin-top:30px; font-weight:bold; font-size:1.5rem; display:none; display:block in print;">
            שבת שלום!
        </div>

        <!-- Dvar Torah (Collapsible) -->
        <div class="dvar-torah-container">
            <button class="dt-btn" onclick="toggleDt()">
                <span>📚 דבר תורה לשבת</span>
                <span id="dt-icon">▼</span>
            </button>
            <div id="dt-content" class="dt-content">
                <div id="dvar-torah-text"></div>
                <div id="dvar-torah-source" style="margin-top:10px; font-weight:bold; color:#666; font-size:0.9rem;"></div>
            </div>
        </div>

    </div>
</div>

<!-- Floating Print Button -->
<button onclick="window.print()" class="floating-print">
    🖨️ הדפס / PDF
</button>

<script>
    setTimeout(() => {
        const loader = document.getElementById('loader');
        if (loader && loader.style.display !== 'none') {
            loader.style.display = 'none';
            document.getElementById('content').classList.remove('hidden');
        }
    }, 4000);

    function toggleDt() {
        const content = document.getElementById('dt-content');
        const icon = document.getElementById('dt-icon');
        if (content.style.display === 'block') {
            content.style.display = 'none';
            icon.innerText = '▼';
        } else {
            content.style.display = 'block';
            icon.innerText = '▲';
        }
    }

    async function fetchShabbatTimes() {
        try {
            const response = await fetch('data.json?t=' + new Date().getTime());
            if (!response.ok) throw new Error("Data file not found");
            const data = await response.json();

            // Set Text
            document.getElementById('parsha-name').innerText = "שבת קודש פרשת " + (data.parsha || "השבוע");
            document.getElementById('candle-lighting').innerText = data.candles;
            document.getElementById('havdalah').innerText = data.havdalah;
            
            const mevDiv = document.getElementById('mevarchim-text');
            if (data.description) {
                mevDiv.innerText = data.description;
                mevDiv.style.display = 'block';
            } else {
                mevDiv.style.display = 'none';
            }

            if (data.dvar_torah) {
                document.getElementById('dvar-torah-text').innerText = data.dvar_torah;
                if (data.dvar_source) document.getElementById('dvar-torah-source').innerText = data.dvar_source;
            } else {
                document.querySelector('.dvar-torah-container').style.display = 'none';
            }

            document.getElementById('mincha-erev').innerText = calculateMincha(data.candles);
            document.getElementById('arvit-motzash').innerText = calculateArvit(data.havdalah);

            document.getElementById('loader').style.display = 'none';
            document.getElementById('content').classList.remove('hidden');

        } catch (error) {
            console.error(error);
            document.getElementById('parsha-name').innerText = "שגיאה בטעינת נתונים";
            document.getElementById('loader').style.display = 'none';
            document.getElementById('content').classList.remove('hidden');
        }
    }

    function timeToMinutes(timeStr) {
        if(!timeStr) return 0;
        const parts = timeStr.split(':');
        return (parseInt(parts[0]) * 60) + parseInt(parts[1]);
    }

    function minutesToTime(totalMinutes) {
        const h = Math.floor(totalMinutes / 60);
        const m = totalMinutes % 60;
        return `${h}:${m.toString().padStart(2, '0')}`;
    }

    function calculateMincha(candleTimeStr) {
        if(!candleTimeStr) return "--:--";
        const cTime = timeToMinutes(candleTimeStr);
        let target = cTime + 15;
        let rounded = Math.ceil(target / 5) * 5;
        if ((rounded - cTime) > 18) rounded -= 5;
        return minutesToTime(rounded);
    }

    function calculateArvit(havdalahTimeStr) {
        if(!havdalahTimeStr) return "--:--";
        const hTime = timeToMinutes(havdalahTimeStr);
        let target = hTime - 5;
        let rounded = Math.round(target / 5) * 5;
        if ((hTime - rounded) > 8) rounded += 5;
        return minutesToTime(rounded);
    }

    fetchShabbatTimes();
</script>

</body>
</html>
