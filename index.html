<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>לוח שבת - קהילת אורות ישראל</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;700&family=Frank+Ruhl+Libre:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root { 
            --primary: #1a3b80; 
            --text: #000000;
            --bg-web: #f4f6f9;
        }

        body { 
            font-family: 'Rubik', sans-serif; 
            margin: 0; padding: 0; 
            background-color: var(--bg-web);
            color: var(--text);
        }

        /* --- WEB CONTAINER --- */
        .web-container {
            max-width: 600px;
            margin: 20px auto;
            background: white;
            padding: 40px; /* Increased padding */
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            min-height: 800px;
            position: relative;
        }

        /* --- HEADER --- */
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee; 
            padding-bottom: 10px;
        }
        
        .bsd { font-family: 'Frank Ruhl Libre', serif; font-size: 14px; }
        .logo-img { height: 70px; object-fit: contain; }

        .main-title {
            text-align: center;
            color: var(--primary);
            font-family: 'Rubik', sans-serif;
            font-weight: 700;
            font-size: 26px;
            margin: 10px 0 5px 0;
        }
        
        .sub-title {
            text-align: center;
            font-weight: 700;
            font-size: 18px;
            /* INCREASED SPACING HERE */
            margin-bottom: 60px; 
            min-height: 20px;
        }

        /* --- GRID LAYOUT (Top Section) --- */
        .top-section-grid {
            display: grid;
            grid-template-columns: 1fr; /* Mobile: Stacked */
            gap: 20px;
            margin-bottom: 30px;
        }

        .times-column {
            text-align: right;
        }

        .image-column {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .shul-image {
            width: 100%;
            max-width: 300px;
            height: auto;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        /* --- TIME ROWS (Global Styles) --- */
        .time-row {
            display: flex;
            gap: 15px;
            margin-bottom: 12px; /* A bit more space between rows */
            font-size: 18px;
            align-items: baseline;
            justify-content: flex-start; /* ALIGN RIGHT (in RTL) */
        }
        .time { font-weight: 700; min-width: 55px; }
        .desc { font-weight: 400; }

        .section-header {
            color: var(--primary);
            font-weight: 700;
            font-size: 18px;
            margin-top: 35px;
            margin-bottom: 15px;
            text-align: right;
        }

        /* --- BOTTOM SECTION (Now Right Aligned) --- */
        .bottom-section {
            text-align: right; /* Changed from Center to Right */
            margin-top: 30px;
        }

        .note-text {
            margin-top: 10px;
            font-size: 16px;
            text-align: right; /* Align note to right */
            margin-right: 70px; /* Indent slightly to align with text not time */
        }

        .footer-shabbat {
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            margin-top: 60px;
            margin-bottom: 20px;
        }

        /* --- CONTROLS (Moved to Bottom) --- */
        .controls { 
            display: flex; justify-content: center; margin-top: 40px; padding-top: 20px; border-top: 1px solid #eee;
        }
        .btn {
            background: var(--primary); color: white; border: none; padding: 12px 25px;
            border-radius: 25px; cursor: pointer; font-family: 'Rubik', sans-serif;
            text-decoration: none; font-size: 16px; display: flex; align-items: center; gap: 8px;
        }
        .btn:hover { opacity: 0.9; }

        /* --- DVAR TORAH --- */
        .dvar-torah-container { margin-top: 30px; border-top: 1px solid #eee; padding-top: 10px; }
        .dt-btn { width: 100%; text-align: right; background: none; border: none; font-size: 16px; font-weight: bold; color: var(--primary); cursor: pointer; display: flex; justify-content: space-between; }
        .dt-content { display: none; padding: 10px; background: #f9f9f9; font-size: 14px; line-height: 1.5; }

        .loader { border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 50px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .hidden { display: none; }

        /* ==========================================================================
           🖨️ PRINT STYLES
           ========================================================================== */
        @media print {
            @page { size: A4 portrait; margin: 1cm; }
            
            body { background: white; -webkit-print-color-adjust: exact; }

            .web-container { box-shadow: none; margin: 0; padding: 0; max-width: 100%; border: none; }
            .controls, .loader, .dvar-torah-container, .waze-link { display: none !important; }

            /* Header */
            .header-row { border-bottom: none; margin-bottom: 0; justify-content: space-between; }
            .logo-img { height: 70px; }
            .main-title { font-size: 28px; margin-top: 10px; color: #1a3b80 !important; }
            .sub-title { font-size: 18px; margin-bottom: 60px; } /* Big space in print too */

            /* Grid Layout */
            .top-section-grid {
                display: grid;
                grid-template-columns: 1fr 280px; /* Text Right, Image Left */
                gap: 40px;
                align-items: start;
            }

            /* Image */
            .shul-image { width: 100%; border: 1px solid #ccc; box-shadow: 2px 2px 5px rgba(0,0,0,0.1); }

            /* Alignments */
            .times-column, .bottom-section, .section-header { text-align: right; }
            .time-row { justify-content: flex-start; } /* Force Right Align */
            
            .section-header { color: #1a3b80 !important; margin-top: 30px; }
            .footer-shabbat { margin-top: 80px; }
            .note-text { margin-right: 70px; }
        }
    </style>
</head>
<body>

<div class="web-container">
    <div id="loader" class="loader"></div>

    <div id="content" class="hidden">
        
        <!-- HEADER -->
        <div class="header-row">
            <div class="bsd">בס"ד</div>
            <div class="logo-area">
                <img src="logo.jpg" alt="Logo" class="logo-img" onerror="this.style.display='none'">
            </div>
        </div>

        <div class="main-title" id="parsha-name">שבת קודש פרשת...</div>
        <div class="sub-title" id="mevarchim-text"></div>

        <!-- TOP SECTION GRID -->
        <div class="top-section-grid">
            
            <!-- RIGHT COLUMN: Times -->
            <div class="times-column">
                <div class="time-row">
                    <span class="time" id="candle-lighting">--:--</span>
                    <span class="desc">הדלקת נרות שבת</span>
                </div>
                <div class="time-row">
                    <span class="time" id="havdalah">--:--</span>
                    <span class="desc">צאת השבת</span>
                </div>

                <div class="section-header">ערב שבת</div>
                <div class="time-row">
                    <span class="time" id="mincha-erev">--:--</span>
                    <span class="desc">מנחה, קבלת שבת וערבית</span>
                </div>
            </div>

            <!-- LEFT COLUMN: Image -->
            <div class="image-column">
                <img src="kotel.jpg" alt="Shul Image" class="shul-image" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/thumb/d/d4/Jerusalem_Symbol.svg/600px-Jerusalem_Symbol.svg.png'">
            </div>
        </div>

        <!-- BOTTOM SECTION (All Right Aligned now) -->
        <div class="bottom-section">
            <div class="section-header">שבת קודש</div>
            
            <div class="time-row">
                <span class="time">7:45</span>
                <span class="desc">שחרית ומוסף</span>
            </div>
            
            <div class="time-row">
                <span class="time">9:15</span>
                <span class="desc">תפילת ילדים</span>
            </div>

            <div class="note-text">
                שיעור מאת הרב נתנאל בהלכות שבת לאחר התפילה
            </div>
        </div>

        <div class="bottom-section">
            <br> 
            <div class="time-row">
                <span class="time">15:00</span>
                <span class="desc">לימוד בספר "אורות"</span>
            </div>
            
            <div class="time-row">
                <span class="time">15:45</span>
                <span class="desc">מנחה של שבת</span>
            </div>

            <div class="time-row">
                <span class="time" id="arvit-motzash">--:--</span>
                <span class="desc">ערבית של מוצאי שבת</span>
            </div>
        </div>

        <div class="footer-shabbat">
            שבת שלום!
        </div>

        <!-- WAZE -->
        <div class="waze-link" style="text-align:center; margin-top:20px;">
            <a href="https://ul.waze.com/ul?ll=31.72202552%2C35.23175955&navigate=yes&zoom=17" class="btn btn-outline" style="display:inline-flex; justify-content:center; width: fit-content; margin: 0 auto; background:none; border: 1px solid var(--primary); color: var(--primary);">
                🚗 נווט לבית הכנסת
            </a>
        </div>

        <!-- DVAR TORAH -->
        <div class="dvar-torah-container">
            <button class="dt-btn" onclick="toggleDt()">
                <span>📚 דבר תורה לשבת</span>
                <span id="dt-icon">▼</span>
            </button>
            <div id="dt-content" class="dt-content">
                <div id="dvar-torah-text"></div>
                <div id="dvar-torah-source" style="margin-top:5px; font-weight:bold; color:#666;"></div>
            </div>
        </div>

        <!-- CONTROLS (Moved to Bottom) -->
        <div class="controls">
            <button onclick="window.print()" class="btn">
                🖨️ הדפס / שמור כ-PDF
            </button>
        </div>

    </div>
</div>

<script>
    setTimeout(() => {
        const loader = document.getElementById('loader');
        if (loader && loader.style.display !== 'none') {
            loader.style.display = 'none';
            document.getElementById('content').classList.remove('hidden');
        }
    }, 4000);

    function toggleDt() {
        const content = document.getElementById('dt-content');
        const icon = document.getElementById('dt-icon');
        if (content.style.display === 'block') {
            content.style.display = 'none';
            icon.innerText = '▼';
        } else {
            content.style.display = 'block';
            icon.innerText = '▲';
        }
    }

    async function fetchShabbatTimes() {
        try {
            const response = await fetch('data.json?t=' + new Date().getTime());
            if (!response.ok) throw new Error("Data file not found");
            const data = await response.json();

            setText('parsha-name', "שבת קודש פרשת " + (data.parsha || "השבוע"));
            setText('candle-lighting', data.candles);
            setText('havdalah', data.havdalah);
            
            const mevDiv = document.getElementById('mevarchim-text');
            if (data.description) {
                mevDiv.innerText = data.description;
                mevDiv.style.display = 'block';
            } else {
                mevDiv.style.display = 'none';
            }

            if (data.dvar_torah) {
                setText('dvar-torah-text', data.dvar_torah);
                if (data.dvar_source) setText('dvar-torah-source', data.dvar_source);
            } else {
                document.querySelector('.dvar-torah-container').style.display = 'none';
            }

            setText('mincha-erev', calculateMincha(data.candles));
            setText('arvit-motzash', calculateArvit(data.havdalah));

            document.getElementById('loader').style.display = 'none';
            document.getElementById('content').classList.remove('hidden');

        } catch (error) {
            console.error(error);
            setText('parsha-name', "שגיאה בטעינת נתונים");
            document.getElementById('loader').style.display = 'none';
            document.getElementById('content').classList.remove('hidden');
        }
    }

    function setText(id, text) {
        const el = document.getElementById(id);
        if (el) el.innerText = text;
    }

    function timeToMinutes(timeStr) {
        if(!timeStr) return 0;
        const parts = timeStr.split(':');
        return (parseInt(parts[0]) * 60) + parseInt(parts[1]);
    }

    function minutesToTime(totalMinutes) {
        const h = Math.floor(totalMinutes / 60);
        const m = totalMinutes % 60;
        return `${h}:${m.toString().padStart(2, '0')}`;
    }

    function calculateMincha(candleTimeStr) {
        if(!candleTimeStr) return "--:--";
        const cTime = timeToMinutes(candleTimeStr);
        let target = cTime + 15;
        let rounded = Math.ceil(target / 5) * 5;
        if ((rounded - cTime) > 18) rounded -= 5;
        return minutesToTime(rounded);
    }

    function calculateArvit(havdalahTimeStr) {
        if(!havdalahTimeStr) return "--:--";
        const hTime = timeToMinutes(havdalahTimeStr);
        let target = hTime - 5;
        let rounded = Math.round(target / 5) * 5;
        if ((hTime - rounded) > 8) rounded += 5;
        return minutesToTime(rounded);
    }

    fetchShabbatTimes();
</script>

</body>
</html>
